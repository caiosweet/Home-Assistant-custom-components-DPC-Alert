name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: "ubuntu-26.04"
    name: With pytest
    steps:
      - name: 📥 Checkout the repository
        uses: "actions/checkout@v7"

      - name: 🐍 Set up Python
        uses: "actions/setup-python@v7"
        with:
          # pytest-homeassistant-custom-component requires the Python of its Home Assistant
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"

      - name: 📦 Install the test requirements
        run: pip install -r requirements_test.txt

      - name: 🔎 Check the types
        run: mypy

      - name: 🧪 Run the tests
        run: pytest --cov --cov-report=term-missing

  node:
    runs-on: "ubuntu-26.04"
    name: Dashboard with node --test
    steps:
      - name: 📥 Checkout the repository
        uses: "actions/checkout@v7"

      - name: 🟢 Set up Node.js
        uses: "actions/setup-node@v7"
        with:
          # The strategy runs in the browsers; Node only runs its tests
          node-version: "24"

      - name: 🧪 Test the dashboard strategy
        run: node --test "tests/frontend/*.test.mjs"
